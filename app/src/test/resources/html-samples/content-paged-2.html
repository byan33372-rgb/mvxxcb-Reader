  <h1>第2章 试炼之塔（2/2）</h1>
</div>
<div id="content">
  <p>第三层起，风刃换成了心魔幻境。沈青临看见家山起火，看见亲人在火中回望。他咬破舌尖，血腥味让神智清明了三分：幻由心生，破幻即是破己。</p>
  <p>走出塔门时天已破晓。守塔长老望着少年单薄的背影，第一次正眼看他："明日辰时，来藏经阁。"</p>
