<div id="content">
  <p>翻过山梁，眼前是一座荒废的驿站。沈青临推门而入，桌上的茶碗竟还温着，灶膛里的灰烬隐约有火星明灭。他心头一凛：这里分明十年无人踏足，可一切迹象都指向刚刚才有人离开。</p>
  <p>墙上的舆图被人用朱砂反复描画，红线自灵剑山一路蜿蜒至此，尽头赫然写着他自己的名字。窗外风声忽紧，檐下的铜铃无风自响，像是在提醒来人：这条路的尽头，早在十年前就有人替他走过了。</p>
