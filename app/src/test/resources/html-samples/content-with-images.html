<div class="chapter-header">
  <h1>第4章 外门大比</h1>
</div>
<div id="content">
  <p>大比当日，演武场四周山头都站满了观礼弟子。沈青临抽到的对手是外门第七的赵铁山，一位练体五重的壮汉。</p>
  <img src="/img/arena.jpg" alt="演武场全景">
  <p>铜锣响过，赵铁山一拳砸来，拳风逼得尘土四散。沈青临不退反进，四十九息调匀真气，在拳锋及体的刹那侧身贴靠。</p>
  <img src="/img/clash.jpg" alt="双方对撞">
  <p>一息，两息……四十九息。真气自丹田炸开，沈青临一掌拍在对方护体罡气的裂缝上。赵铁山踉跄七步，坐倒在尘埃里。</p>
  <p>全场寂静。守塔长老抚掌而笑："灵台四十九息，练到第七重回响……三十年了，总算又见着一个。"</p>
</div>
