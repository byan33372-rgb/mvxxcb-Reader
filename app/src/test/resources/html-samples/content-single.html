<div id="content">
  <p>晨雾未散，山门前的青石阶已被露水浸得发亮。少年背着半旧的行囊，一步一步往上走，掌心被竹杖磨出了红痕。</p>
  <p>守门弟子上下打量他一番，丢下一块木牌："新晋杂役，寅时起洒扫，误了时辰扣月钱。"少年双手接住，低声道谢。</p>
  <p>他叫沈青临，三年前家山毁于大火，只带着一册残破的吐纳图谱流落至此。图谱残页上只有八个字：气沉丹田，意守灵台。</p>
  <p>入夜，杂役房鼾声四起。沈青临盘膝坐在草席上，依着图谱吐纳。一缕微凉的气息自百会缓缓沉入丹田，微弱得像风中之烛，却真实存在。</p>
