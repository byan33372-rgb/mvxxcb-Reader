<div class="chapter-header">
  <h1>第7章 独行</h1>
</div>
<div id="content">
  <p>城外的官道上只剩他一个人。萧拾遗把油纸伞压低了半寸，雨点敲在伞面上，密得像有人在急促叩门。</p>
  <p>包袱里那册残卷又被他翻过了三遍。缺页的地方用前朝的账本纸补着，补纸上的墨字早褪成了淡灰色，只有批注的小楷还认得出几个。</p>
  <p>渡口的灯笼在雨雾里晕成一团团黄光。船家说今晚水急，不肯开船。萧拾遗付了双倍的船钱，船家看了看他的眼神，还是收了。</p>
  <p>船离岸的时候，他听见身后的官道上传来马蹄声。他没有回头，只是把残卷往怀里又拢了拢。</p>
</div>
