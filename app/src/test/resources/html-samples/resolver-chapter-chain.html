  <h1>第30章 雪线</h1>
  <a href="/resolver/read/c29.html">上一章</a>
</div>
<div id="content">
  <p>海拔五千二百米，空气稀薄得像被抽走了一半。沈亦踩上雪线的瞬间，靴底传来冻壳碎裂的脆响。</p>
  <p>协作扎西在前面用冰镐敲出踢踏的节奏，那是告诉后面的人：步幅放小，呼吸放匀。沈亦跟着节奏，一步一步把身体往上挪。</p>
  <p>风从山脊的另一侧翻过来，卷着雪粒打在防风镜上，沙沙作响。他想起父亲说过的话：上山的人不数步子，数步子的人上不了山。</p>
  <p>下午三点，他们抵达一号休息点。帐篷在雪地里撑开的时候，沈亦回头看了一眼来路——云海在脚下铺开，来时的公路细得像一根线。</p>
</div>
