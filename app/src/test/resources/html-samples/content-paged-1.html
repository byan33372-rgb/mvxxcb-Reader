  <h1>第2章 试炼之塔</h1>
</div>
<div id="content">
  <p>试炼之塔立于外门深处，共九层，塔身刻满上古符文。沈青临握紧木牌，跨过门槛的刹那，四周景物骤然一变。</p>
  <p>第一层是风刃长廊。数百道风刃自两侧墙壁呼啸而出，他贴地翻滚，衣角被削去一片。守塔长老在塔外捻须而笑：这小子，身法倒是不差。</p>
